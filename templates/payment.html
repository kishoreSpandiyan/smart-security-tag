<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Process product payment to unlock the security tag">
    <title>Payment — Smart Security Tag</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- ====== Navbar ====== -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="nav-brand">
                <div class="nav-brand-icon">🛡️</div>
                <span>SecureTag</span>
            </a>
            <ul class="nav-links">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/payment" class="active">Payment</a></li>
            </ul>
        </div>
    </nav>

    <!-- ====== Payment Form ====== -->
    <div class="centered-container">
        <div class="payment-card">
            <div class="payment-card-icon">🔒</div>
            <h2>Product Payment</h2>

            <form action="/pay" method="POST" id="payment-form">

                <div class="form-group">
                    <label for="product_name">Product Name</label>
                    <input type="text" id="product_name" name="product_name" class="form-input"
                        value="Smart Tag Product" placeholder="Enter product name" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input" value="499"
                        placeholder="Enter amount" min="1" required>
                </div>

                <button type="submit" class="btn btn-primary" id="pay-btn">
                    💳 Pay Now
                </button>

            </form>

            <a href="/" class="btn btn-secondary">
                ← Go to Dashboard
            </a>
        </div>
    </div>

</body>

</html>
